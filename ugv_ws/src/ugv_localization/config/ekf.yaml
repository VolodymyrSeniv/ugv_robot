# Fuses stereo visual odometry (/vo/odom) with IMU yaw rate. No wheel odometry: the robot has no encoders.
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /vo/odom
    #               x      y      z      roll   pitch  yaw    vx     vy     vz     vroll  vpitch vyaw   ax     ay     az
    odom0_config: [true,  true,  false, false, false, true,  false, false, false, false, false, false, false, false, false]
    odom0_queue_size: 10

    imu0: /imu
    imu0_config:  [false, false, false, false, false, false, false, false, false, false, false, true,  false, false, false]
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: false

    # Velocity command as a loose twist measurement (see ugv_mission/cmd_vel_odom.py): stops the
    # filter extrapolating a stale velocity when VO is lost.
    odom1: /cmd_odom
    #               x      y      z      roll   pitch  yaw    vx     vy     vz     vroll  vpitch vyaw   ax     ay     az
    odom1_config: [false, false, false, false, false, false, true,  false, false, false, false, true,  false, false, false]
    odom1_queue_size: 10
